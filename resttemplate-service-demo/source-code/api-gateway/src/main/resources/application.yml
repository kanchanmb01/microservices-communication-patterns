server:
  port: 8083
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
       - id: user-ms
         uri:
          lb://USER-MS
         predicates:
         - Path=/api/user/**
       - id: income-ms
         uri:
          lb://INCOME-MS 
         predicates:
         - Path=/api/income/**		 

eureka:
 instance:
  hostname: localhost
 client:
  service-url:
   defaultZone: http://localhost:8761/eureka/    

